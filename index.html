<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Typerfy</title>
  <meta name="description" content="Typerfy — Interactive Generative Botanical Typography Engine. Real-time organic growth, procedural vines, blooming flowers, marine ecosystems, and living physics letters on Canvas 2D.">
  <meta name="keywords" content="Typerfy, generative typography, canvas art, procedural botanical, creative coding, javascript canvas, interactive art, organic typography, kinetic type">
  <meta name="author" content="omerfy">
  <meta property="og:title" content="Typerfy — Generative Botanical Typography Engine">
  <meta property="og:description" content="An interactive generative typography canvas experience where letters bloom with organic flora, vines, dynamic petals, and animated fauna in real-time.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://github.com/omerfys/Typerfy">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Typerfy — Generative Botanical Typography">
  <meta name="twitter:description" content="Type and watch your words bloom into organic gardens, sakura blossoms, and bioluminescent coral reefs.">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A0A0A'/%3E%3Cpath d='M26 48 C 24 38, 30 32, 32 26' fill='none' stroke='%233257FF' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M28 40 C 20 38, 18 32, 24 30 C 28 34, 28 38, 28 40 Z' fill='%233257FF'/%3E%3Cellipse cx='32' cy='22' rx='14' ry='12' fill='%23FF1400'/%3E%3Cpath d='M24 24 C 22 17, 28 12, 34 14 C 40 16, 42 22, 38 27 C 33 30, 26 28, 26 22 C 26 18, 30 16, 34 18 C 36 19, 36 22, 34 23' fill='none' stroke='%23FFB4A8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=DM+Mono:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'DM Mono', ui-monospace, monospace;
    }
    a { color: #fff; text-decoration: none; }
    a:hover { color: #FFB4A8; }
    input[type=range] { accent-color: #FFFFFF; }
    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    [data-tg="app"] {
      position: fixed;
      inset: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      cursor: text;
    }
    html[data-touch] [data-tg="app"] {
      touch-action: none;
      top: var(--tg-top, 0px) !important;
      bottom: auto !important;
      height: var(--tg-h, 100%) !important;
    }

    /* Top Navigation Bar */
    [data-tg="top-bar"] {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      left: calc(20px + env(safe-area-inset-left));
      right: calc(20px + env(safe-area-inset-right));
      z-index: 10;
      pointer-events: none;
    }
    [data-tg="top-bar"] > * {
      pointer-events: auto;
    }

    /* Theme selector - perfectly centered horizontally */
    [data-tg="themes"] {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid #2A2A2A;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      overflow-x: auto;
      scrollbar-width: none;
      max-width: calc(100vw - 180px);
    }
    [data-tg="themes"]::-webkit-scrollbar { display: none; }

    .tg-theme-btn {
      border: 0;
      border-radius: 999px;
      padding: 7px 16px;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.03em;
      cursor: pointer;
      background: transparent;
      color: #9E9E9E;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .tg-theme-btn:hover {
      color: #FFFFFF;
    }
    .tg-theme-btn.active {
      background: #FFFFFF;
      color: #000000;
      font-weight: 500;
    }

    /* Mode switcher - positioned at top right */
    [data-tg="modes"] {
      position: absolute;
      right: 0;
      top: 0;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid #2A2A2A;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .tg-mode-btn {
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      color: #BDBDBD;
      transition: background 0.15s, color 0.15s;
    }
    .tg-mode-btn.active {
      background: #FFFFFF;
      color: #000000;
      font-weight: 500;
    }

    /* Bottom Bar in Typing View */
    [data-tg="bar"] {
      position: absolute;
      left: calc(24px + env(safe-area-inset-left));
      right: calc(24px + env(safe-area-inset-right));
      bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #FFFFFF;
      opacity: 0.75;
      z-index: 8;
      pointer-events: none;
      transition: opacity 0.2s, color 0.2s;
    }
    [data-tg="bar"] > * {
      pointer-events: auto;
    }
    [data-tg="hints"] {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    [data-tg="coarse"] { display: none; }
    @media (pointer: coarse) {
      [data-tg="fine"] { display: none; }
      [data-tg="coarse"] { display: inline; }
    }

    [data-tg="count"]:empty { display: none; }
    [data-tg="count"]::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 8px;
      vertical-align: 1px;
      animation: tg-live 2.4s ease-in-out infinite;
    }
    @keyframes tg-live {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    [data-tg="ctrls"] {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    [data-tg="pal"] {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 4px 6px;
      border: 1px solid #3A3A3A;
      border-radius: 999px;
      background: #000000;
      transition: background 0.2s;
    }
    [data-tg="sw"] {
      --sw: 22px;
      width: var(--sw);
      height: var(--sw);
      padding: 0;
      border-radius: 999px;
      cursor: pointer;
      border: 1.5px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, border-color 0.15s;
    }
    [data-tg="sw"]:hover {
      transform: scale(1.15) !important;
    }
    [data-tg="dot"] {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: block;
    }
    [data-tg="btn"] {
      background: transparent;
      border: 1px solid #3A3A3A;
      color: #BDBDBD;
      font: inherit;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    [data-tg="btn"]:hover {
      border-color: #FFFFFF;
      color: #FFFFFF;
    }

    /* Peers / Multi-gardener */
    .tg-peer {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      transition: opacity 0.45s;
      font-family: 'DM Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      line-height: 1;
      pointer-events: none;
      z-index: 5;
    }
    .tg-peer svg { display: block; overflow: visible; }
    .tg-peer span {
      position: absolute;
      left: 14px;
      top: 18px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #000;
      white-space: nowrap;
      font-weight: 500;
    }

    /* Poster View */
    [data-tg="poster"] {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      background: #000000;
      cursor: default;
      color: #EDEDED;
      font-size: 12px;
      letter-spacing: 0.03em;
      z-index: 9;
    }
    [data-tg="panel"] {
      border-right: 1px solid #1E1E1E;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 22px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: #0A0A0A;
    }
    [data-tg="stage"] {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 68px 32px 32px;
      min-width: 0;
      background: #000000;
    }
    [data-tg="pcanvas"] {
      width: min(100%, calc(100vh - 100px));
      height: auto;
      aspect-ratio: 1 / 1;
      display: block;
      border: 1px solid #1E1E1E;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    /* Responsive */
    @media (max-width: 600px) {
      [data-tg="top-bar"] {
        flex-wrap: wrap;
        gap: 8px;
      }
      [data-tg="bar"] {
        left: calc(16px + env(safe-area-inset-left)) !important;
        right: calc(16px + env(safe-area-inset-right)) !important;
        bottom: calc(14px + env(safe-area-inset-bottom)) !important;
        gap: 10px !important;
      }
      [data-tg="hints"] { gap: 12px !important; font-size: 11px; }
      [data-tg="ctrls"] { flex: 1 1 100%; justify-content: space-between; gap: 8px !important; }
      [data-tg="pal"] { gap: 4px !important; }
      [data-tg="sw"] {
        --sw: clamp(13px, calc((100vw - 183px) / 10), 22px);
        width: var(--sw) !important;
        height: var(--sw) !important;
      }
      [data-tg="dot"] {
        width: calc(var(--sw) * 0.46) !important;
        height: calc(var(--sw) * 0.46) !important;
      }
      [data-tg="btn"] { padding: 7px 11px !important; }
      .tg-peer { font-size: 10px; }
      .tg-peer svg { width: 15px; height: 17px; }
      .tg-peer span { left: 12px; top: 15px; padding: 3px 7px; }
    }

    @media (max-width: 720px) {
      [data-tg="poster"] {
        display: flex !important;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      [data-tg="poster"]::before {
        content: "";
        order: -2;
        position: sticky;
        top: 0;
        flex: none;
        height: calc(60px + env(safe-area-inset-top));
        margin-bottom: calc(-60px - env(safe-area-inset-top));
        background: linear-gradient(#000 62%, rgba(0, 0, 0, 0));
        z-index: 4;
        pointer-events: none;
      }
      [data-tg="stage"] {
        order: -1;
        flex: none;
        padding: calc(72px + env(safe-area-inset-top)) 16px 12px !important;
      }
      [data-tg="pcanvas"] {
        width: 100% !important;
        max-width: 520px;
      }
      [data-tg="panel"] {
        flex: none;
        border-right: 0 !important;
        border-top: 1px solid #1E1E1E;
        overflow: visible !important;
        padding: 20px 16px calc(32px + env(safe-area-inset-bottom)) !important;
      }
    }
  </style>
</head>
<body>

<div data-tg="app" id="app">
  <!-- Interactive typing canvas -->
  <canvas id="typeCanvas" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
  <div data-tg="peers" id="peersContainer" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4;"></div>
  <input id="hiddenInput" data-tg="input" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" style="position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none;">

  <!-- Top bar: Theme selector & Mode switcher -->
  <div data-tg="top-bar">
    <div data-tg="themes" id="themeSelectorContainer">
      <!-- Theme pills injected via JS -->
    </div>

    <div data-tg="modes">
      <button type="button" class="tg-mode-btn active" id="modeTypeBtn">Type</button>
      <button type="button" class="tg-mode-btn" id="modePosterBtn">Poster</button>
    </div>
  </div>

  <!-- Bottom hint & toolbar bar for typing view -->
  <div data-tg="bar" id="bottomBar">
    <div data-tg="hints">
      <span data-tg="fine" id="hintTypeTxt">type to grow roses</span><span data-tg="coarse">tap to type</span>
      <span id="hintCutTxt">space cuts</span>
      <span data-tg="fine">backspace withers</span><span data-tg="coarse">⌫ withers</span>
      <span data-tg="fine">enter clears</span><span data-tg="coarse">return clears</span>
      <span data-tg="count" id="liveCount"></span>
    </div>
    <div data-tg="ctrls">
      <div data-tg="pal" id="paletteSwatches">
        <!-- Palette swatches injected via JS -->
      </div>
      <button type="button" data-tg="btn" id="savePNGBtn">PNG</button>
      <button type="button" data-tg="btn" id="saveSVGBtn">SVG</button>
    </div>
  </div>

  <!-- Poster panel view -->
  <div data-tg="poster" id="posterContainer" style="display:none;">
    <div data-tg="panel">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div id="posterTitleFont" style="font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:26px;letter-spacing:0;color:#FFFFFF">Poster</div>
        <div style="color:#8C8C8C" id="posterInfoLabel">1:1 · 3s loop · 30 fps</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Words</div>
        <input type="text" id="posterTextInput" value="in bloom" spellcheck="false" style="background:#000;border:1px solid #2A2A2A;border-radius:10px;color:#FFFFFF;font-weight:700;font-size:22px;padding:10px 12px;outline:none;" onfocus="this.style.borderColor='#FFFFFF'" onblur="this.style.borderColor='#2A2A2A'">
        <button type="button" id="posterReshuffleBtn" style="align-self:flex-start;background:transparent;border:1px solid #2A2A2A;color:#EDEDED;font:inherit;padding:8px 12px;border-radius:999px;cursor:pointer;" onmouseenter="this.style.borderColor='#FFFFFF'" onmouseleave="this.style.borderColor='#2A2A2A'">Regrow garden</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Motion</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="presetButtonsGrid">
          <!-- Preset buttons injected via JS -->
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Palette</div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px" id="posterPalettesGrid">
          <!-- Poster palette cards injected via JS -->
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px;border-top:1px solid #1E1E1E;padding-top:20px">
        <div style="color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em">Export · 1080 × 1080 loop</div>
        <button type="button" id="exportVideoBtn" style="background:#FFFFFF;border:0;color:#000;font:inherit;font-weight:500;padding:12px 14px;border-radius:999px;cursor:pointer;">Export MP4 loop</button>
        <button type="button" id="exportFramesBtn" style="background:transparent;border:1px solid #3A3A3A;color:#EDEDED;font:inherit;padding:11px 14px;border-radius:999px;cursor:pointer;" onmouseenter="this.style.borderColor='#FFFFFF'" onmouseleave="this.style.borderColor='#3A3A3A'">PNG frames (.zip)</button>
        <div style="color:#8C8C8C;min-height:16px" id="posterStatusLabel"></div>
      </div>
    </div>

    <div data-tg="stage">
      <canvas id="posterCanvas" data-tg="pcanvas" width="1080" height="1080"></canvas>
    </div>
  </div>
</div>

<script>
/**
 * THEME DEFINITIONS: Rose Garden (Original), Sakura Zen & Coral Abyss
 */
const THEMES = {
  rose: {
    id: 'rose',
    name: 'Rose Garden',
    font: '"Playfair Display", Georgia, serif',
    hintType: 'type to grow',
    hintCut: 'space cuts',
    defaultWord: 'in bloom',
    creatureName: 'butterfly',
    palettes: [
      ['Rose noir', '#000000', '#FF1400', '#3257FF', '#FFB4A8', '#FFFFFF'],
      ['Paper', '#F3EEE4', '#FF3B1F', '#1C2B8F', '#FFD2C4', '#111111'],
      ['Midnight', '#0D1B4C', '#FF5A4E', '#9FB4FF', '#FFD6CF', '#FFFFFF'],
      ['Citrus', '#0E1A12', '#FF8A00', '#1FA463', '#FFE2B8', '#FFF6E8'],
      ['Orchid', '#140A1F', '#E63CFF', '#2FB8A6', '#F9D1FF', '#FFFFFF'],
      ['Moss', '#133A2A', '#FFB7C5', '#7FD18B', '#FFFFFF', '#F6F1E7'],
      ['Tomato', '#FF1400', '#FFF1E0', '#0B0B0B', '#FF1400', '#000000'],
      ['Butter', '#FFE9A8', '#E4002B', '#0F5132', '#FFC2C2', '#1A1A1A'],
      ['Blush', '#FAD4D8', '#C8102E', '#274690', '#FFE3E6', '#1A1A1A'],
      ['Mono', '#000000', '#F2F2F2', '#6E6E6E', '#000000', '#FFFFFF']
    ]
  },
  sakura: {
    id: 'sakura',
    name: 'Sakura Zen',
    font: '"Cormorant Garamond", "Playfair Display", serif',
    hintType: 'type to grow cherry blossoms',
    hintCut: 'space scatters petals',
    defaultWord: 'hanami',
    creatureName: 'dragonfly',
    palettes: [
      ['Cherry Mist', '#0C0A0E', '#FF7597', '#8A6D56', '#FFE3EC', '#FFFFFF'],
      ['Kyoto Night', '#121826', '#FF9EAA', '#5B7065', '#FFF0F5', '#F5F5F7'],
      ['Spring Rice', '#F7F3EE', '#E84A5F', '#523A28', '#FFB6B9', '#222222'],
      ['Matcha Tea', '#1B2418', '#FFB7C5', '#88A76C', '#FFFFFF', '#E8EFE6'],
      ['Crimson Shrine', '#2B0E14', '#FF4D6D', '#B08968', '#FFCCD5', '#FFF0F3'],
      ['Silver Mist', '#1E1E24', '#D4A373', '#70798C', '#FAEDCD', '#F4F4F9']
    ]
  },
  coral: {
    id: 'coral',
    name: 'Coral Abyss',
    font: '"Playfair Display", "Cinzel", serif',
    hintType: 'type to grow coral reefs',
    hintCut: 'space blooms anemones',
    defaultWord: 'deep tide',
    creatureName: 'jellyfish',
    palettes: [
      ['Abyssal Trench', '#020C1B', '#FF5376', '#1E5F74', '#FFD2DC', '#E6F1FF'],
      ['Great Barrier', '#001E2B', '#FF7F50', '#00A896', '#FFE0D6', '#F0FDF4'],
      ['Deep Sea Pearl', '#081726', '#E2D9F3', '#396EB0', '#FFFFFF', '#FFFFFF'],
      ['Electric Kelp', '#03140C', '#2EE6A8', '#0F5738', '#C4FCEB', '#EDFDF8'],
      ['Sunken Gold', '#0E1724', '#F4A261', '#2A9D8F', '#FFE8D6', '#FFFFFF'],
      ['Biolume Trench', '#00060E', '#00B4D8', '#023E8A', '#CAF0F8', '#FFFFFF']
    ]
  }
};

class TypeGardenApp {
  constructor() {
    this.cv = document.getElementById('typeCanvas');
    this.inp = document.getElementById('hiddenInput');
    this.pcv = document.getElementById('posterCanvas');
    this.peersContainer = document.getElementById('peersContainer');
    this.bottomBar = document.getElementById('bottomBar');
    this.paletteSwatches = document.getElementById('paletteSwatches');
    this.presetButtonsGrid = document.getElementById('presetButtonsGrid');
    this.posterPalettesGrid = document.getElementById('posterPalettesGrid');
    this.posterContainer = document.getElementById('posterContainer');
    this.posterTextInput = document.getElementById('posterTextInput');
    this.posterInfoLabel = document.getElementById('posterInfoLabel');
    this.posterStatusLabel = document.getElementById('posterStatusLabel');
    this.posterTitleFont = document.getElementById('posterTitleFont');
    this.exportVideoBtn = document.getElementById('exportVideoBtn');
    this.exportFramesBtn = document.getElementById('exportFramesBtn');
    this.modeTypeBtn = document.getElementById('modeTypeBtn');
    this.modePosterBtn = document.getElementById('modePosterBtn');
    this.liveCountEl = document.getElementById('liveCount');
    this.themeSelectorContainer = document.getElementById('themeSelectorContainer');
    this.hintTypeTxt = document.getElementById('hintTypeTxt');
    this.hintCutTxt = document.getElementById('hintCutTxt');

    this.FLOWERS = ['iris', 'fern', 'poppy', 'tulip', 'violet', 'clover', 'daisy', 'lilac', 'aster', 'peony', 'sorrel', 'yarrow', 'thistle', 'bluebell', 'foxglove', 'primrose'];
    this.TINTS = ['#FF8A00', '#E63CFF', '#7FD18B', '#9FB4FF', '#FFB7C5', '#FFE2B8', '#2FB8A6', '#FFD23F'];
    this.SENT = String.fromCharCode(0x200b);

    this.PRESETS = [
      { id: 'breathe', label: 'Breathe', sub: 'Slow sway · 3s', T: 3000 },
      { id: 'grow', label: 'Grow & wither', sub: 'Bloom, then back · 6s', T: 6000 },
      { id: 'typed', label: 'Typed', sub: 'Type, cut, repeat · 5s', T: 5000 },
      { id: 'wind', label: 'Gust', sub: 'Wind sweeps through · 4s', T: 4000 },
      { id: 'reach', label: 'Reach', sub: 'Stems follow light · 6s', T: 6000 },
      { id: 'scatter', label: 'Scatter', sub: 'Random bloom, fade · 6s', T: 6000 },
      { id: 'visit', label: 'Visitor', sub: 'Creature drops by · 7s', T: 7000 }
    ];

    this.props = {
      boil: true,
      recoil: 20,
      density: 1,
      showHint: true
    };

    this.state = {
      theme: 'rose',
      mode: 'type',
      preset: 'breathe',
      palette: 0,
      text: 'in bloom',
      seed: 7,
      status: '',
      busy: false
    };

    this.letters = [];
    this.uid = 1;
    this.cache = {};
    this.Sd = 0;
    this.St = 0;
    this.wrapped = false;
    this.t0 = performance.now();
    this.lastKey = 0;
    this.rand = Math.random;
    this.fa = {};
    this.mx = null;
    this.my = null;
    this.flies = [];
    this.perch = [];
    this.gifts = [];
    this.peers = new Map();

    this.init();
  }

  get currentTheme() {
    return THEMES[this.state.theme] || THEMES.rose;
  }

  get F() {
    return this.currentTheme.font;
  }

  get PAL() {
    return this.currentTheme.palettes;
  }

  init() {
    this.g = this.cv.getContext('2d');
    
    // Resize handling
    this.onResize = () => this.resize();
    window.addEventListener('resize', this.onResize);
    this.resize();

    // Keyboard listener
    this.onKey = e => this.key(e);
    window.addEventListener('keydown', this.onKey);

    // Pointer events
    this.onMove = e => { this.mx = e.clientX; this.my = e.clientY; };
    this.onLeave = () => { this.mx = null; this.my = null; };
    window.addEventListener('pointermove', this.onMove);
    document.addEventListener('pointerleave', this.onLeave);

    // Touch support
    this.touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
    if (this.touch) document.documentElement.setAttribute('data-touch', '');
    this.ptype = 'mouse';
    this.onPD = e => { this.ptype = e.pointerType || 'mouse'; };
    window.addEventListener('pointerdown', this.onPD, true);
    this.onUp = e => { if (e.pointerType && e.pointerType !== 'mouse') { this.mx = null; this.my = null; } };
    window.addEventListener('pointerup', this.onUp);
    window.addEventListener('pointercancel', this.onUp);

    // Hidden input field
    const fld = this.inp;
    this.iv = this.SENT;
    if (fld) fld.value = this.SENT;
    this.onCS = () => { this.composing = true; };
    this.onCE = () => {
      this.composing = false;
      setTimeout(() => {
        const f = this.inp;
        if (f && !this.composing) this.inputDiff(f);
      }, 0);
    };
    if (fld) {
      fld.addEventListener('compositionstart', this.onCS);
      fld.addEventListener('compositionend', this.onCE);
      fld.addEventListener('input', e => this.inputDiff(e.target));
    }

    // Visual Viewport
    this.vv = window.visualViewport || null;
    this.vvMax = 0;
    this.onVV = () => this.syncVV();
    if (this.vv && this.touch) {
      this.vv.addEventListener('resize', this.onVV);
      this.vv.addEventListener('scroll', this.onVV);
      this.syncVV();
    }

    // Canvas focus
    const appEl = document.getElementById('app');
    appEl.addEventListener('pointerdown', ev => this.handleFocus(ev));
    appEl.addEventListener('click', ev => this.handleTapFocus(ev));

    // Live multiplayer
    this.liveInit();

    // Check supported video mime types
    this.vmime = typeof MediaRecorder !== 'undefined' ? 
      ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) : null;

    if (this.exportVideoBtn) {
      this.exportVideoBtn.textContent = this.vmime ? 
        `Export ${this.vmime.includes('mp4') ? 'MP4' : 'WebM'} loop` : 'Video export unavailable';
    }

    // Setup UI components
    this.buildThemeSelector();
    this.setupUI();
    this.updateAppTheme();

    // Font loading
    if (document.fonts) {
      document.fonts.ready.then(() => {
        this.cache = {};
        this.layout();
        this.buildPoster();
      }).catch(() => {});
    }

    // Initial poster build
    this.buildPoster();

    // Animation frame loop
    const loop = () => {
      this.raf = requestAnimationFrame(loop);
      this.frame();
    };
    loop();

    if (!this.touch) {
      setTimeout(() => this.inp && this.inp.focus({ preventScroll: true }), 50);
    }
  }

  buildThemeSelector() {
    this.themeSelectorContainer.innerHTML = '';
    Object.keys(THEMES).forEach(themeKey => {
      const t = THEMES[themeKey];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `tg-theme-btn ${this.state.theme === themeKey ? 'active' : ''}`;
      btn.id = `theme-btn-${themeKey}`;
      btn.textContent = t.name;
      btn.addEventListener('click', () => {
        this.setTheme(themeKey);
      });
      this.themeSelectorContainer.appendChild(btn);
    });
  }

  setTheme(themeKey) {
    if (!THEMES[themeKey]) return;
    this.state.theme = themeKey;
    this.state.palette = 0;
    this.cache = {};
    
    // Update theme selector pills
    Object.keys(THEMES).forEach(k => {
      const b = document.getElementById(`theme-btn-${k}`);
      if (b) {
        if (k === themeKey) b.classList.add('active');
        else b.classList.remove('active');
      }
    });

    const th = this.currentTheme;
    this.hintTypeTxt.textContent = th.hintType;
    this.hintCutTxt.textContent = th.hintCut;
    if (this.posterTitleFont) this.posterTitleFont.style.fontFamily = th.font;
    if (this.posterTextInput) this.posterTextInput.style.fontFamily = th.font;

    // Clear and regenerate current letters elements for the new theme
    this.letters.forEach(l => {
      if (l.ch !== ' ') {
        this.gen(l);
        if (l.cut != null) this.genEnd(l, 200);
      }
    });

    this.setupPalettesUI();
    this.updateAppTheme();
    this.layout(true);
    this.buildPoster();
    this.refocus();
  }

  setupUI() {
    // Mode switcher buttons
    this.modeTypeBtn.addEventListener('click', () => this.setMode('type'));
    this.modePosterBtn.addEventListener('click', () => this.setMode('poster'));

    // Save PNG / SVG buttons in typing view
    document.getElementById('savePNGBtn').addEventListener('click', () => {
      this.savePNG();
      this.refocus();
    });
    document.getElementById('saveSVGBtn').addEventListener('click', () => {
      this.saveSVG();
      this.refocus();
    });

    // Poster text input & buttons
    this.posterTextInput.addEventListener('input', e => {
      this.state.text = e.target.value;
      this.buildPoster();
    });
    document.getElementById('posterReshuffleBtn').addEventListener('click', () => {
      this.state.seed = Math.floor(Math.random() * 1e6);
      this.buildPoster();
    });
    this.exportVideoBtn.addEventListener('click', () => this.exportVideo());
    this.exportFramesBtn.addEventListener('click', () => this.exportFrames());

    // Build Motion Preset Buttons in Poster View
    this.presetButtonsGrid.innerHTML = '';
    this.PRESETS.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.id = `preset-btn-${p.id}`;
      btn.style.textAlign = 'left';
      btn.style.background = this.state.preset === p.id ? '#161616' : 'transparent';
      btn.style.border = `1px solid ${this.state.preset === p.id ? '#FFFFFF' : '#2A2A2A'}`;
      btn.style.color = '#FFFFFF';
      btn.style.padding = '10px 12px';
      btn.style.borderRadius = '10px';
      btn.style.cursor = 'pointer';
      btn.style.display = 'flex';
      btn.style.flexDirection = 'column';
      btn.style.gap = '4px';
      btn.innerHTML = `
        <span style="font-size:13px">${p.label}</span>
        <span style="color:#8C8C8C;font-size:11px">${p.sub}</span>
      `;
      btn.addEventListener('click', () => {
        this.setPreset(p.id);
      });
      this.presetButtonsGrid.appendChild(btn);
    });

    this.setupPalettesUI();
  }

  setupPalettesUI() {
    // Build Palette Swatches in Typing View
    this.paletteSwatches.innerHTML = '';
    this.PAL.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('data-tg', 'sw');
      btn.setAttribute('aria-label', p[0]);
      btn.title = p[0];
      btn.style.background = p[1];
      btn.innerHTML = `<span data-tg="dot" style="background:${p[2]}"></span>`;
      btn.addEventListener('click', e => {
        e.stopPropagation();
        this.setPalette(i);
      });
      this.paletteSwatches.appendChild(btn);
    });

    // Build Palette Cards in Poster View
    this.posterPalettesGrid.innerHTML = '';
    this.PAL.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.id = `poster-pal-${i}`;
      btn.setAttribute('aria-label', p[0]);
      btn.style.display = 'flex';
      btn.style.flexDirection = 'column';
      btn.style.gap = '8px';
      btn.style.alignItems = 'stretch';
      btn.style.background = 'transparent';
      btn.style.border = `1px solid ${this.state.palette === i ? '#FFFFFF' : '#2A2A2A'}`;
      btn.style.color = '#EDEDED';
      btn.style.padding = '6px 6px 8px';
      btn.style.borderRadius = '12px';
      btn.style.cursor = 'pointer';
      btn.style.textAlign = 'left';
      btn.innerHTML = `
        <span style="display:flex;align-items:center;justify-content:center;height:44px;border-radius:8px;background:${p[1]}">
          <span style="width:18px;height:18px;border-radius:50%;background:${p[2]}"></span>
          <span style="width:12px;height:12px;border-radius:50%;background:${p[3]};margin-left:-4px"></span>
          <span style="font-family:${this.F};font-weight:700;font-size:18px;color:${p[5]};margin-left:8px">Aa</span>
        </span>
        <span style="padding:0 4px">${p[0]}</span>
      `;
      btn.addEventListener('click', () => {
        this.setPalette(i);
      });
      this.posterPalettesGrid.appendChild(btn);
    });

    this.updatePaletteActiveStates();
  }

  setMode(mode) {
    if (mode === 'poster' && this.state.mode !== 'poster') {
      const live = this.liveText();
      this.state.text = live || this.state.text || this.currentTheme.defaultWord;
      this.posterTextInput.value = this.state.text;
      this.state.mode = 'poster';
      this.modeTypeBtn.classList.remove('active');
      this.modePosterBtn.classList.add('active');
      this.cv.style.display = 'none';
      this.peersContainer.style.display = 'none';
      this.bottomBar.style.display = 'none';
      this.posterContainer.style.display = 'grid';
      this.buildPoster();
    } else if (mode === 'type' && this.state.mode !== 'type') {
      this.state.mode = 'type';
      this.modePosterBtn.classList.remove('active');
      this.modeTypeBtn.classList.add('active');
      this.cv.style.display = 'block';
      this.peersContainer.style.display = 'block';
      this.bottomBar.style.display = 'flex';
      this.posterContainer.style.display = 'none';
      this.resize();
      this.refocus();
    }
  }

  setPreset(presetId) {
    this.state.preset = presetId;
    this.PRESETS.forEach(p => {
      const btn = document.getElementById(`preset-btn-${p.id}`);
      if (btn) {
        btn.style.background = p.id === presetId ? '#161616' : 'transparent';
        btn.style.borderColor = p.id === presetId ? '#FFFFFF' : '#2A2A2A';
      }
    });
    const pr = this.preset();
    this.posterInfoLabel.textContent = `1:1 · ${pr.T / 1000}s loop · 30 fps`;
    this.buildPoster();
  }

  setPalette(index) {
    this.state.palette = index;
    this.updatePaletteActiveStates();
    this.updateAppTheme();
    this.refocus();
    if (this.state.mode === 'poster') {
      this.buildPoster();
    }
  }

  updatePaletteActiveStates() {
    const activePal = this.pal();
    const swatches = this.paletteSwatches.querySelectorAll('[data-tg="sw"]');
    swatches.forEach((btn, i) => {
      const isCur = i === this.state.palette;
      btn.style.borderColor = isCur ? activePal.C.text : (this.PAL[i] && this.PAL[i][1] === activePal.bg ? '#3A3A3A' : 'transparent');
      btn.style.transform = isCur ? 'scale(1.1)' : 'scale(1)';
    });

    this.PAL.forEach((_, i) => {
      const card = document.getElementById(`poster-pal-${i}`);
      if (card) {
        card.style.borderColor = i === this.state.palette ? '#FFFFFF' : '#2A2A2A';
      }
    });
  }

  updateAppTheme() {
    const p = this.pal();
    const appEl = document.getElementById('app');
    if (appEl) appEl.style.background = p.bg;
    if (this.bottomBar) {
      this.bottomBar.style.color = p.C.text;
    }
    if (this.paletteSwatches) {
      this.paletteSwatches.style.background = p.bg;
    }
  }

  handleFocus(ev) {
    if (this.state.mode !== 'type' || !this.inp) return;
    const touch = ev && ev.pointerType && ev.pointerType !== 'mouse';
    const onCanvas = ev && ev.target === this.cv;
    if (touch) {
      if (ev.cancelable && (onCanvas || (ev.target.closest && ev.target.closest('button')))) {
        ev.preventDefault();
      }
    } else {
      this.inp.focus({ preventScroll: true });
    }
    if (onCanvas) {
      this.spawnFly(ev.clientX, ev.clientY);
    }
  }

  handleTapFocus(ev) {
    if (this.state.mode === 'type' && this.inp && this.ptype !== 'mouse' && ev.target === this.cv) {
      this.inp.focus({ preventScroll: true });
    }
  }

  // ---------- math & helper utilities ----------
  h(n) {
    const x = Math.sin(n) * 43758.5453;
    return x - Math.floor(x);
  }
  spr(t, k = 7, w = 16) {
    if (t <= 0) return 0;
    return 1 - Math.exp(-t * k) * Math.cos(t * w);
  }
  eo(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.pow(1 - t, 3);
  }
  eb(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  rng(seed) {
    let s = seed | 0;
    return () => {
      s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  bez(a, b, c, d, n) {
    const P = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      P.push([
        u*u*u*a[0] + 3*u*u*t*b[0] + 3*u*t*t*c[0] + t*t*t*d[0],
        u*u*u*a[1] + 3*u*u*t*b[1] + 3*u*t*t*c[1] + t*t*t*d[1]
      ]);
    }
    return P;
  }
  at(P, u) {
    const n = P.length;
    const i = Math.min(n - 2, Math.max(1, Math.round(u * (n - 1))));
    return [P[i], Math.atan2(P[i+1][1] - P[i-1][1], P[i+1][0] - P[i-1][0])];
  }
  jit(id, f, amp) {
    if (!amp) return [0, 0, 0];
    return [
      (this.h(id*1.37 + f*7.13)*2 - 1)*amp,
      (this.h(id*2.71 + f*3.11)*2 - 1)*amp,
      (this.h(id*5.3 + f*1.7)*2 - 1)*0.035
    ];
  }
  path(c, p, closed) {
    const n = p.length;
    if (n < 2) return;
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if (closed) {
      const s = m(p[n-1], p[0]);
      c.moveTo(s[0], s[1]);
      for (let i = 0; i < n; i++) {
        const q = m(p[i], p[(i+1) % n]);
        c.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
      }
      c.closePath();
    } else {
      c.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < n - 1; i++) {
        const q = m(p[i], p[i+1]);
        c.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
      }
      c.lineTo(p[n-1][0], p[n-1][1]);
    }
  }
  backend(g) {
    return {
      fill: (p, col) => {
        g.beginPath();
        this.path(g, p, true);
        g.fillStyle = col;
        g.fill();
      },
      stroke: (p, col, w) => {
        g.beginPath();
        this.path(g, p, false);
        g.strokeStyle = col;
        g.lineWidth = w;
        g.lineCap = 'round';
        g.lineJoin = 'round';
        g.stroke();
      },
      rect: (x, y, w, h, col) => {
        g.fillStyle = col;
        g.fillRect(x, y, w, h);
      },
      text: (ch, x, y, S, col) => {
        g.font = `700 ${S}px ${this.F}`;
        g.textAlign = 'center';
        g.textBaseline = 'alphabetic';
        g.fillStyle = col;
        g.fillText(ch, x, y);
      }
    };
  }

  // Branch line generators
  vine(base, dir, len, amp, waves, ph, bend, n = 40) {
    const theme = this.state.theme;
    const P = [[base[0], base[1]]], step = len / n;
    let x = base[0], y = base[1];

    if (theme === 'sakura') {
      // Angular woody bonsai twigs
      for (let i = 1; i <= n; i++) {
        const u = i / n;
        const kinky = Math.sin(u * Math.PI * 4 + ph) * 0.25 * bend;
        const a = dir + bend * u * 0.8 + kinky;
        x += Math.cos(a) * step;
        y += Math.sin(a) * step;
        P.push([x, y]);
      }
      return P;
    }

    // Rose & Coral: Natural undulating vines
    for (let i = 1; i <= n; i++) {
      const u = i / n, a = dir + bend * u + amp * Math.sin(u * Math.PI * waves + ph) * Math.min(1, u * 3);
      x += Math.cos(a) * step;
      y += Math.sin(a) * step;
      P.push([x, y]);
    }
    return P;
  }

  curl(P, sign, rad) {
    const n = P.length, e = P[n - 1], a = Math.atan2(e[1] - P[n - 2][1], e[0] - P[n - 2][0]);
    const c = [e[0] - Math.sin(a) * sign * rad, e[1] + Math.cos(a) * sign * rad];
    const a0 = Math.atan2(e[1] - c[1], e[0] - c[0]);
    for (let i = 1; i <= 14; i++) {
      const u = i / 14, t = a0 + sign * u * Math.PI * 1.6, rr = rad * (1 - 0.5 * u);
      P.push([c[0] + Math.cos(t) * rr, c[1] + Math.sin(t) * rr]);
    }
    return P;
  }
  weave(r, startLayer) {
    const cuts = [];
    const nc = 1 + Math.floor(r() * 3);
    for (let i = 0; i < nc; i++) cuts.push(0.15 + r() * 0.7);
    cuts.sort((a, b) => a - b);
    const segs = [];
    let u0 = 0, layer = startLayer;
    for (const c of cuts) {
      if (c <= u0) continue;
      segs.push({ u0, u1: c, layer });
      if (r() < 0.3) {
        const g = 0.02 + r() * 0.03;
        u0 = Math.min(0.98, c + g);
      } else u0 = c;
      layer = 1 - layer;
    }
    segs.push({ u0, u1: 1, layer });
    return segs;
  }
  layerAt(segs, u) {
    for (const s of segs) if (u >= s.u0 && u <= s.u1) return s.layer;
    return segs[segs.length - 1].layer;
  }

  // ---------- layout engine ----------
  resize() {
    const c = this.cv, r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    if (!r.width) return;
    this.W = r.width;
    this.H = r.height;
    this.dpr = d;
    c.width = Math.round(r.width * d);
    c.height = Math.round(r.height * d);
    this.layout(true);
  }
  mw(ch) {
    if (this.cache[ch] != null) return this.cache[ch];
    this.g.font = `700 100px ${this.F}`;
    let w = this.g.measureText(ch).width / 100;
    if (ch === ' ') w *= 1.4;
    return (this.cache[ch] = w);
  }
  layoutCore(A, W, H, prevWrapped) {
    const maxW = W * 0.8, S0 = H * 0.28, LH = 2.1;
    const ws = A.map(l => this.mw(l.ch));
    const words = [];
    let cur = null;
    A.forEach((l, i) => {
      if (l.ch === ' ') {
        if (cur) { words.push(cur); cur = null; }
        words.push({ sp: true, idx: [i] });
      } else {
        if (!cur) cur = { idx: [] };
        cur.idx.push(i);
      }
    });
    if (cur) words.push(cur);

    const lineW = (li, S) => {
      let e = li.length;
      while (e > 0 && A[li[e-1]].ch === ' ') e--;
      let w = 0;
      for (let k = 0; k < e; k++) w += ws[li[k]];
      return w * S;
    };
    const wrap = S => {
      const lines = [[]];
      let lw = 0;
      for (const w of words) {
        const ww = w.idx.reduce((s, i) => s + ws[i], 0) * S;
        if (!w.sp && lw > 0 && lw + ww > maxW) {
          lines.push([]);
          lw = 0;
        }
        lines[lines.length - 1].push(...w.idx);
        lw += ww;
      }
      return lines;
    };

    let lines = [A.map((_, i) => i)];
    const unit = lineW(lines[0], 1);
    let S = unit > 0 ? Math.min(S0, maxW / unit) : S0;
    const multi = words.filter(w => !w.sp).length > 1;
    let wrapped = multi && (S < H * 0.1 || (prevWrapped && S < H * 0.14));
    if (wrapped) {
      let lo = H * 0.03, hi = H * 0.15;
      for (let k = 0; k < 22; k++) {
        const mid = (lo + hi) / 2, ls = wrap(mid);
        const ok = ls.every(li => lineW(li, mid) <= maxW) && ls.length * LH * mid <= H * 0.82;
        if (ok) lo = mid; else hi = mid;
      }
      S = lo;
      lines = wrap(S);
      if (lines.length < 2) wrapped = false;
    }
    const n = lines.length, lh = LH * S;
    lines.forEach((li, k) => {
      let x = W / 2 - lineW(li, S) / 2;
      const y = H / 2 + (k - (n - 1) / 2) * lh + 0.33 * S;
      li.forEach(i => {
        const l = A[i], w = ws[i] * S;
        l.tx = x + w / 2;
        l.ty = y;
        l.tw = w;
        l.line = k;
        x += w;
      });
    });
    return { S, wrapped, n };
  }
  layout(snap) {
    if (!this.W) return;
    const A = this.letters.filter(l => !l.dead);
    const res = this.layoutCore(A, this.W, this.H, this.wrapped);
    this.wrapped = res.wrapped;
    A.forEach(l => {
      if (l.x == null) { l.x = l.tx; l.y = l.ty; }
    });
    const S = res.S, last = A[A.length - 1];
    this.St = S;
    this.ctx_ = last ? last.tx + last.tw / 2 + 0.07 * S : this.W / 2;
    this.cty = last ? last.ty - 0.33 * S : this.H / 2;
    if (snap || !this.Sd) {
      this.Sd = S;
      this.cx = this.ctx_;
      this.cy = this.cty;
      A.forEach(l => { l.x = l.tx; l.y = l.ty; });
    }
  }

  // ---------- live multiplayer & interactive creatures ----------
  spawnFly(cx, cy) {
    if (this.flies.length >= 6) {
      const o = this.flies.find(f => f.st !== 'leave');
      if (o) this.flyOff(o);
    }
    const taken = new Set(this.flies.filter(f => f.st !== 'leave').map(f => f.pid));
    let best = null, bd = 1e9;
    for (const p of this.perch) {
      if (taken.has(p.id)) continue;
      const d = Math.hypot(p.x - cx, p.y - cy);
      if (d < bd) { bd = d; best = p; }
    }
    const left = cx < this.W / 2, sz = Math.max(9, this.Sd * 0.09);
    this.flies.push({
      x: left ? -40 : this.W + 40,
      y: cy + (Math.random() - 0.5) * this.H * 0.4,
      vx: 0,
      vy: 0,
      st: best ? 'fly' : 'wander',
      pid: best ? best.id : null,
      hx: cx,
      hy: cy,
      t0: performance.now(),
      ph: Math.random() * 6,
      sz,
      seed: Math.random() * 100,
      ang: 0
    });
  }
  flyOff(f) {
    f.st = 'leave';
    f.pid = null;
    f.ex = f.x < this.W / 2 ? -80 : this.W + 80;
    f.ey = f.y - this.H * 0.3;
  }
  drawFlies(B, now, C) {
    const dt = Math.min(48, now - (this._fl || now));
    this._fl = now;
    const byId = {};
    for (const p of this.perch) byId[p.id] = p;

    this.flies = this.flies.filter(f => {
      const t = (now - f.t0) / 1000;
      let tx, ty;
      if (f.st === 'sit' || f.st === 'fly') {
        const p = byId[f.pid];
        if (!p) { this.flyOff(f); }
        else { tx = p.x + p.R * 0.05; ty = p.y - p.R * 0.55; }
      }
      if (f.st === 'wander') {
        tx = f.hx + Math.sin(t * 1.3 + f.seed) * 70;
        ty = f.hy + Math.sin(t * 2.1 + f.seed) * 40;
        if (t > 3.5) this.flyOff(f);
      }
      if (f.st === 'leave') { tx = f.ex; ty = f.ey; }

      if (f.st === 'sit') {
        f.x += (tx - f.x) * 0.35;
        f.y += (ty - f.y) * 0.35;
        f.ang *= 0.85;
        f.ph += dt * 0.004;
        const burst = Math.sin(now / 1000 * 0.9 + f.seed) > 0.75;
        f.open = burst ? 0.2 + 0.8 * Math.abs(Math.cos(now / 1000 * 9 + f.seed)) : 0.25 + 0.15 * Math.sin(f.ph);
      } else {
        const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1;
        const sp = f.st === 'leave' ? 0.42 : Math.min(0.34, 0.06 + d * 0.0016);
        const flut = Math.sin(t * 7 + f.seed) * 0.12, wob = Math.cos(t * 4.3 + f.seed) * 0.1;
        const ax = (dx / d * sp + wob) - f.vx, ay = (dy / d * sp + flut) - f.vy;
        f.vx += ax * 0.06 * dt / 16;
        f.vy += ay * 0.06 * dt / 16;
        f.x += f.vx * dt;
        f.y += f.vy * dt + Math.sin(t * 13 + f.seed) * 0.6;
        f.ang += (Math.max(-0.5, Math.min(0.5, f.vx * 1.4)) - f.ang) * 0.1;
        f.open = Math.abs(Math.cos(t * 17 + f.seed));
        if (f.st === 'fly' && d < 5) { f.st = 'sit'; f.ph = 0; }
        if (f.st === 'leave' && (f.x < -60 || f.x > this.W + 60 || f.y < -60)) return false;
      }
      this.drawCreature(B, f.x, f.y, f.sz, f.ang, f.open, C);
      return true;
    });
  }

  drawCreature(B, x, y, s, ang, o, C) {
    const theme = this.state.theme;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const T = (px, py) => [x + (px * ca - py * sa) * s, y + (px * sa + py * ca) * s];

    if (theme === 'sakura') {
      // Red Dragonfly with slender needle wings
      const wing = (a, side) => {
        const pts = [], c = Math.cos(a), sn = Math.sin(a);
        for (let k = 0; k <= 10; k++) {
          const u = k / 10;
          pts.push(T(side * (0.1 + u * 1.1 * c), u * 0.8 * sn + Math.sin(u * Math.PI) * 0.15 * (0.2 + 0.8 * o)));
        }
        return pts;
      };
      B.stroke(wing(0.3, 1), C.line, s * 0.04);
      B.stroke(wing(0.3, -1), C.line, s * 0.04);
      B.stroke(wing(-0.2, 1), C.line, s * 0.04);
      B.stroke(wing(-0.2, -1), C.line, s * 0.04);
      // Slender body
      B.stroke([T(0, -0.6), T(0, 0.7)], C.red, s * 0.12);
      return;
    }

    if (theme === 'coral') {
      // Ocean / Coral Abyss: Translucent glowing jellyfish bell with trailing tentacles
      const bell = [];
      for (let k = 0; k <= 16; k++) {
        const th = k / 16 * Math.PI;
        bell.push(T(Math.cos(th) * 0.55, -Math.sin(th) * 0.45));
      }
      bell.push(T(-0.55, 0));
      B.fill(bell, C.red);
      for (let k = -2; k <= 2; k++) {
        const tx = k * 0.2;
        B.stroke([T(tx, 0), T(tx + Math.sin(o * 6 + k) * 0.15, 0.6), T(tx, 1.2)], C.line, s * 0.05);
      }
      return;
    }

    // Default Rose Garden: Butterfly
    const wing = (cx, cy, rx, ry, a, side) => {
      const pts = [], c = Math.cos(a), sn = Math.sin(a);
      for (let k = 0; k < 22; k++) {
        const th = k / 22 * Math.PI * 2, r = 1 + 0.08 * Math.sin(th * 3);
        const lx = Math.cos(th) * rx * r, ly = Math.sin(th) * ry * r;
        pts.push(T(side * (cx + lx * c - ly * sn) * (0.12 + 0.88 * o), cy + lx * sn + ly * c));
      }
      return pts;
    };
    for (const sd of [-1, 1]) {
      B.fill(wing(0.46, 0.28, 0.36, 0.3, 0.5 * sd * sd, sd), C.text);
      B.fill(wing(0.55, -0.32, 0.55, 0.36, -0.55, sd), C.text);
      if (o > 0.35) B.fill(wing(0.66, -0.4, 0.13, 0.11, 0, sd), C.red);
    }
    const body = [];
    for (let k = 0; k < 18; k++) {
      const th = k / 18 * Math.PI * 2;
      body.push(T(Math.cos(th) * 0.08, Math.sin(th) * 0.48));
    }
    B.fill(body, C.blue);
    const lw = Math.max(0.8, s * 0.05);
    B.stroke([T(0, -0.42), T(-0.14, -0.72), T(-0.24, -0.86)], C.blue, lw);
    B.stroke([T(0, -0.42), T(0.14, -0.72), T(0.24, -0.86)], C.blue, lw);
  }

  faceTurn(e, x, y) {
    let wx = 0, wy = 0;
    const A = this.near(x, y);
    if (A) {
      const dx = A[0] - x, dy = A[1] - y, d = Math.hypot(dx, dy), reach = 300;
      if (d < reach && d > 0.001) {
        const w = 1 - d / reach, s = w * w * (3 - 2 * w) * Math.min(1, d / 40);
        wx = dx / d * s;
        wy = dy / d * s;
      }
    }
    const c = this.fa[e.id] || [0, 0];
    c[0] += (wx - c[0]) * 0.09;
    c[1] += (wy - c[1]) * 0.09;
    this.fa[e.id] = c;
    return c;
  }
  near(x, y) {
    let best = (this.mx != null && this.my != null) ? [this.mx, this.my] : null;
    let bd = best ? Math.hypot(best[0] - x, best[1] - y) : 1e9;
    if (this.peers && this.peers.size) {
      const now = performance.now();
      for (const p of this.peers.values()) {
        if (p.h || p.x == null || now - p.t > 8000) continue;
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < bd) { bd = d; best = [p.x, p.y]; }
      }
    }
    return best;
  }

  liveInit() {
    const pick = a => a[Math.floor(Math.random() * a.length)];
    this.me = { id: Math.random().toString(36).slice(2, 10), n: pick(this.FLOWERS), c: pick(this.TINTS) };
    this.others = 0;
    this.lastSend = 0;
    this.sentX = null;
    this.sentY = null;
    this.roster = {};

    this.onPlant = e => {
      if (this.state.mode !== 'type' || e.target !== this.cv) return;
      const now = performance.now(), lp = this.lastTap;
      this.lastTap = { t: now, x: e.clientX, y: e.clientY };
      if (lp && now - lp.t < 340 && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) < 40 && now - (this.lastPlant || 0) > 1800) {
        this.lastPlant = now;
        this.lastTap = null;
        const g = { x: Math.round(e.clientX / this.W * 1000) / 1000, y: Math.round(e.clientY / this.H * 1000) / 1000, s: Math.floor(Math.random() * 1e6) };
        this.liveRose(g);
        this.liveSend('r', g);
      }
    };
    window.addEventListener('pointerdown', this.onPlant);

    this.onOut = e => {
      if (!e.relatedTarget) {
        this.mx = null;
        this.my = null;
        this.sentX = null;
        this.liveSend('p', { i: this.me.id, h: 1 });
      }
    };
    document.addEventListener('mouseout', this.onOut);

    this.onVis = () => {
      if (document.hidden) {
        this.liveSend('p', { i: this.me.id, h: 1 });
        this._idleT = setTimeout(() => this.liveClose(), 60000);
      } else {
        clearTimeout(this._idleT);
        if (!this.net) this.liveConnect();
      }
    };
    document.addEventListener('visibilitychange', this.onVis);
    setTimeout(() => this.liveConnect(), 500);
  }

  liveConnect() {
    if (this.net || this._connecting) return;
    this.liveLocal();
  }

  liveLocal() {
    try {
      if (typeof BroadcastChannel === 'undefined') return;
      const bc = new BroadcastChannel('tg-live'), roster = new Map();
      const publish = () => {
        const now = Date.now(), out = {};
        for (const [k, v] of roster) {
          if (now - v.t > 3500) roster.delete(k);
          else out[k] = { n: v.n, c: v.c };
        }
        this.livePresence(out);
      };
      const beat = () => {
        roster.set(this.me.id, { n: this.me.n, c: this.me.c, t: Date.now() });
        bc.postMessage({ k: 'hello', id: this.me.id, n: this.me.n, c: this.me.c });
        publish();
      };
      bc.onmessage = ({ data: d }) => {
        if (!d) return;
        if (d.k === 'hello') {
          const had = roster.has(d.id);
          roster.set(d.id, { n: d.n, c: d.c, t: Date.now() });
          if (!had) publish();
        } else if (d.k === 'bye') {
          roster.delete(d.id);
          publish();
        } else if (d.k === 'p') this.livePeer(d.payload);
        else if (d.k === 'r') this.liveRose(d.payload);
      };
      beat();
      this._beat = setInterval(beat, 1000);
      this.net = {
        send: (ev, payload) => bc.postMessage({ k: ev, payload }),
        close: () => {
          bc.postMessage({ k: 'bye', id: this.me.id });
          clearInterval(this._beat);
          bc.close();
        }
      };
    } catch(e) {}
  }

  liveClose() {
    if (this.net) { this.net.close(); this.net = null; }
    for (const id of [...this.peers.keys()]) this.peerDrop(id);
    this.others = 0;
    this.liveCount(1);
  }
  liveSend(ev, payload) {
    if (this.net && this.others > 0) {
      try { this.net.send(ev, payload); } catch (e) {}
    }
  }
  livePresence(meta) {
    this.roster = meta || {};

    this.others = n - 1;
    for (const id of [...this.peers.keys()]) if (!this.roster[id]) this.peerDrop(id);
    for (const [id, p] of this.peers) {
      const r = this.roster[id];
      if (r && (r.n !== p.n || r.c !== p.c)) this.peerStyle(p, r);
    }
    this.liveCount(n);
  }
  liveCount(n) {
    if (this.liveCountEl) {
      this.liveCountEl.textContent = n > 1 ? `${n} gardeners here` : '';
    }
  }
  livePeer(d) {
    if (!d || typeof d.i !== 'string' || d.i === this.me.id) return;
    let p = this.peers.get(d.i);
    if (!p) {
      if (this.peers.size >= 40) return;
      p = this.peerMake(d.i);
    }
    p.t = performance.now();
    p.h = !!d.h;
    if (!d.h && typeof d.x === 'number' && typeof d.y === 'number') {
      p.tx = Math.min(1.02, Math.max(-0.02, d.x));
      p.ty = Math.min(1.02, Math.max(-0.02, d.y));
      if (p.x == null) { p.x = p.tx * this.W; p.y = p.ty * this.H; }
    }
  }
  peerMake(id) {
    const el = document.createElement('div');
    el.className = 'tg-peer';
    el.style.opacity = '0';
    el.innerHTML = '<svg width="18" height="20" viewBox="0 0 18 20"><path d="M1 1L1 16L5.5 12L8.5 19L11.5 17.6L8.6 11H15Z" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg><span></span>';
    if (this.peersContainer) this.peersContainer.appendChild(el);
    const p = { id, el, x: null, y: null, tx: 0, ty: 0, t: 0, h: true, op: 0 };
    this.peers.set(id, p);
    this.peerStyle(p, this.roster[id] || {});
    return p;
  }
  peerStyle(p, r) {
    p.n = r.n || 'visitor';
    p.c = /^#[0-9A-Fa-f]{6}$/.test(r.c || '') ? r.c : '#FFFFFF';
    p.el.querySelector('path').setAttribute('fill', p.c);
    const s = p.el.querySelector('span');
    s.textContent = p.n;
    s.style.background = p.c;
  }
  peerDrop(id) {
    const p = this.peers.get(id);
    if (p) {
      p.el.remove();
      this.peers.delete(id);
    }
  }
  liveStep(now, dt) {
    const N = this.others + 1;
    const iv = Math.min(10000, Math.max(125, (1000 * N * N) / 40));
    if (this.net && this.others > 0 && this.mx != null && !document.hidden && now - this.lastSend >= iv) {
      const x = Math.round((this.mx / this.W) * 1000) / 1000;
      const y = Math.round((this.my / this.H) * 1000) / 1000;
      if (x !== this.sentX || y !== this.sentY) {
        this.lastSend = now;
        this.sentX = x;
        this.sentY = y;
        this.liveSend('p', { i: this.me.id, x, y });

    const tau = Math.min(900, Math.max(70, 0.55 * iv));
    const k = 1 - Math.exp(-dt / tau);
    let shown = 0;
    for (const p of [...this.peers.values()].sort((a, b) => b.t - a.t)) {
      const idle = now - p.t, vis = !p.h && p.x != null && idle < 45000 && shown < 24;
      if (vis) {
        shown++;
        p.x += (p.tx * this.W - p.x) * k;
        p.y += (p.ty * this.H - p.y) * k;
        p.el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px)`;
      }
      const op = !vis ? 0 : idle < 8000 ? 1 : 0.35;
      if (p.op !== op) { p.op = op; p.el.style.opacity = String(op); }
    }
  }
  liveRose(g) {
    if (!g || typeof g.x !== 'number' || typeof g.y !== 'number') return;
    const r = this.rng((g.s | 0) || 1);
    this.gifts.push({
      x: Math.min(1, Math.max(0, g.x)),
      y: Math.min(1, Math.max(0, g.y)),
      t0: performance.now(),
      rot: (r() - 0.5) * 0.8,
      e: { ph1: r() * 6.283, ph2: r() * 6.283, turns: 1.4 + r() * 0.5 }
    });
    if (this.gifts.length > 14) this.gifts.shift();
  }

  // ---------- mobile viewport & input ----------
  syncVV() {
    const vv = this.vv;
    if (!vv) return;
    const w = Math.round(vv.width);
    if (this.vvW !== w) { this.vvW = w; this.vvMax = 0; }
    this.vvMax = Math.max(this.vvMax, vv.height);
    const kb = this.vvMax - vv.height > 120, de = document.documentElement;
    de.style.setProperty('--tg-top', vv.offsetTop + 'px');
    de.style.setProperty('--tg-h', vv.height + 'px');
    if (kb) de.setAttribute('data-kb', ''); else de.removeAttribute('data-kb');
    if (!kb && this.kbWas && document.activeElement === this.inp) this.inp.blur();
    this.kbWas = kb;
    this.resize();
  }
  refocus() {
    if (this.ptype === 'mouse' && this.state.mode === 'type' && this.inp) {
      this.inp.focus({ preventScroll: true });
    }
  }
  liveText() {
    return (this.letters || []).filter(l => !l.dead).map(l => l.ch).join('').trim();
  }
  wither(now) {
    const A = this.letters.filter(l => !l.dead), last = A[A.length - 1];
    if (!last) return;
    last.dead = now;
    const pv = A[A.length - 2];
    if (pv && pv.ch !== ' ') {
      pv.cut = null;
      pv.endEls = null;
      pv.tb = now;
    }
    this.layout();
  }
  inputDiff(el) {
    const S = this.SENT;
    if (this.state.mode !== 'type' || this._kd) {
      this.iv = this.composing ? el.value : S;
      if (!this.composing) el.value = S;
      return;
    }
    const old = this.iv == null ? S : this.iv, cur = el.value;
    let p = 0;
    while (p < old.length && p < cur.length && old[p] === cur[p]) p++;
    let dels = old.length - p;
    if (p === 0 && old[0] === S && old.length > 1) dels -= 1;
    const now = performance.now();
    this.lastKey = now;
    for (let i = 0; i < dels; i++) this.wither(now);
    for (const ch of cur.slice(p)) {
      if (ch === S) continue;
      if (ch.charCodeAt(0) === 10) {
        this.letters = [];
        this.layout();
      } else {
        this.add(ch, now);
      }
    }
    if (this.composing) this.iv = cur;
    else { el.value = S; this.iv = S; }
  }

  // ---------- input events ----------
  key(e) {
    if (this.state.mode !== 'type') return;
    if (e.metaKey || e.ctrlKey || e.altKey) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        e.shiftKey ? this.saveSVG() : this.savePNG();
      }
      return;
    }
    if (e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') && e.target !== this.inp && (e.key === 'Enter' || e.key === ' ')) {
      return;
    }
    const now = performance.now();
    const A = this.letters.filter(l => !l.dead), last = A[A.length - 1];
    if (e.key === 'Backspace') {
      e.preventDefault();
      this.mark();
      if (!last) return;
      last.dead = now;
      const pv = A[A.length - 2];
      if (pv && pv.ch !== ' ') {
        pv.cut = null;
        pv.endEls = null;
        pv.tb = now;
      }
      this.layout();
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      this.mark();
      this.letters = [];
      this.layout();
      return;
    }
    if (e.key.length !== 1) return;
    e.preventDefault();
    this.mark();
    this.add(e.key, now);

  mark() {

  }
  add(ch, now) {
    const A = this.letters.filter(l => !l.dead), last = A[A.length - 1];

        this.genEnd(last, now - last.birth);
      }
      this.letters.push({ ch: ' ', id: this.uid++, birth: now, els: [] });
      this.layout();
      return;
    }
    const same = last && last.ch !== ' ';
    const l = {
      ch,
      id: this.uid++,
      birth: now,
      tb: now,
      ws: same ? last.ws : Math.floor(this.rand() * 1e9),
      wi: same ? last.wi + 1 : 0,
      prev: same ? last : null
    };
    this.gen(l);
    this.letters.push(l);
    this.layout();
  }

  // ---------- generative element generator ----------
  wordParams(ws) {
    const r = this.rng(ws * 7 + 13), dens = this.props.density ?? 1;

      roseP: 0.35 + r() * 0.3,
      leafy: (0.6 + r() * 0.8) * dens,
      dens,
      lean: (r() - 0.5) * 0.6,

    for (const l of L) {
      if (l.ch !== ' ' && (st.textAll || !l.dead)) {
        B.text(l.ch, l.x, l.y, S, st.C.text);
      }
    }
    draw(1);
  }

  wpt(st, l, x, y) {
    if (l.birth != null && this._now != null) {
      const t = (this._now - l.birth) * (st.speed || 1) / 1000;
      if (t > 0 && t < 2.5) {
        const hh = Math.max(0, (l.y - y) / st.S), dmp = Math.exp(-t * 3.2), dir = (l.id % 2 ? 1 : -1);
        x += st.S * 0.07 * hh * dmp * Math.sin(t * 11) * dir;
        y += st.S * 0.035 * hh * dmp * Math.sin(t * 11 + 1.2);
      }
    }
    if (st.face && l.lean) {
      const hh = Math.min(2.5, Math.max(0, (l.y - y) / st.S)), f = hh * hh * 0.5 + hh * 0.5;
      x += l.lean[0] * st.S * 0.1 * f;
      y += l.lean[1] * st.S * 0.05 * f;
    }
    return st.warp ? st.warp(x, y, l) : [x, y];
  }

  drawStem(B, e, l, age, kk, st, f, amp, layer, frO) {
    const S = st.S, fr = frO != null ? frO : this.eo((age - e.d0) / e.dur) * kk;
    if (fr <= 0) return;
    const j = this.jit(e.id, f, amp);
    const P = e.pts.map(p => this.wpt(st, l, l.x + p[0] * S + j[0], l.y + p[1] * S + j[1]));
    for (const sg of e.segs) {
      if (sg.layer !== layer) continue;
      const b = Math.min(sg.u1, fr);
      if (b <= sg.u0) continue;
      this.strokeRange(B, P, sg.u0, b, st.C.blue, S * 0.022 * (e.w || 1));

    for (const th of e.thorns) {
      if (fr > th.u && this.layerAt(e.segs, th.u) === layer) {
        this.thorn(B, P, th.u, th.s, S);

    }
  }

  drawEl(B, e, l, age, kk, st, f, amp) {
    const S = st.S, j = this.jit(e.id, f, amp);
    const wx = (x, y) => this.wpt(st, l, l.x + x * S + j[0], l.y + y * S + j[1]);
    const rw = st.rotw ? st.rotw(e) : 0;
    if (e.t === 'leaf') {
      const sc = this.spr((age - e.d0) / 1000, 7, 15) * kk;
      if (sc <= 0) return;
      const p = wx(e.x, e.y);
      this.leaf(B, p[0], p[1], e.a + j[2] + rw, e.L * S * sc, e.bend);
    } else if (e.t === 'flower' || e.t === 'rose') {
      const a = age - e.d0;
      if (a < 0 || kk <= 0.001) return;
      const p = wx(e.x, e.y), tl = st.face ? this.faceTurn(e, p[0], p[1]) : null;
      if ((st.face || st.perchOn) && !l.dead && a > 700) {
        this.perch.push({ id: e.id, x: p[0], y: p[1], R: e.R * S * kk });
      }
      this.flower(B, p[0], p[1], e.R * S * kk, e.rot + j[2] + rw + (tl ? tl[0] * 0.22 : 0), e, a, tl);

  }

  // ---------- poster generation ----------
  preset() {
    return this.PRESETS.find(p => p.id === this.state.preset) || this.PRESETS[0];
  }
  buildPoster() {
    if (!this.g) return;
    const s = this.state, pr = this.preset(), text = (s.text || '').slice(0, 40) || ' ';
    this.rand = this.rng(s.seed * 7919 + 1);
    const L = [];
    let prev = null, uid = 1;
    for (const ch of text) {
      if (ch === ' ') {
        const sp = { ch: ' ', id: 9000 + uid++, els: [] };
        L.push(sp);
        prev = sp;
        continue;
      }
      const same = prev && prev.ch !== ' ';
      const l = {
        ch,
        id: 9000 + uid++,
        ws: same ? prev.ws : Math.floor(this.rand() * 1e9),
        wi: same ? prev.wi + 1 : 0,
        prev: same ? prev : null
      };
      this.gen(l);
      L.push(l);
      prev = l;
    }
    const n = L.length;
    const step = pr.id === 'reference' ? 30 : pr.id === 'grow' ? Math.min(110, 3000 / n) : pr.id === 'typed' ? Math.min(85, 3600 / n) : 0;
    const off = pr.id === 'grow' ? 200 : pr.id === 'typed' ? 300 : 0;
    L.forEach((l, i) => { l.b = off + i * step; });
    if (pr.id === 'scatter') {
      const r = this.rng(s.seed * 31 + 5);
      L.forEach(l => { l.b = 150 + r() * 2400; });
    }
    const wd = Math.min(60, 900 / n);
    L.forEach((l, i) => {
      l.d = pr.id === 'scatter' ? 4700 + i * 8 : 4200 + (n - 1 - i) * wd;
      const nx = L[i + 1];
      l.cutRel = null;
      if (pr.id !== 'scatter' && l.ch !== ' ' && nx && nx.ch === ' ') {
        l.cutRel = Math.max(30, nx.b - l.b);
        this.genEnd(l, l.cutRel);
      }
    });

    this.rand = Math.random;
    const res = this.layoutCore(L, 1080, 1080, false);
    let S = res.S, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const addP = (l, x, y, r) => {
      const X = l.tx + x * S, Y = l.ty + y * S, R = (r || 0) * S;
      x0 = Math.min(x0, X - R); x1 = Math.max(x1, X + R);
      y0 = Math.min(y0, Y - R); y1 = Math.max(y1, Y + R);
    };
    for (const l of L) {
      if (l.ch === ' ') continue;
      addP(l, -l.tw / S / 2, -0.75);
      addP(l, l.tw / S / 2, 0.1);
      const all = [...l.els, ...(l.endEls || [])];
      for (const e of all) {
        if (e.t === 'stem') e.pts.forEach(q => addP(l, q[0], q[1], 0.02));
        else if (e.t === 'leaf') addP(l, e.x, e.y, e.L);
        else addP(l, e.x, e.y, e.R * 1.15);
      }
    }

    let tx0 = 1e9, tx1 = -1e9, ty0 = 1e9, ty1 = -1e9;
    for (const l of L) {
      if (l.ch !== ' ') {
        tx0 = Math.min(tx0, l.tx - l.tw / 2);
        tx1 = Math.max(tx1, l.tx + l.tw / 2);
        ty0 = Math.min(ty0, l.ty - 0.72 * S);
        ty1 = Math.max(ty1, l.ty);
      }
    }
    const Z = 1080, half = Z * 0.44, bcx = (tx0 + tx1) / 2, bcy = (ty0 + ty1) / 2;
    const k = Math.min(1.25, half / Math.max(1, bcx - x0, x1 - bcx), half / Math.max(1, bcy - y0, y1 - bcy));
    L.forEach(l => {
      l.tx = Z / 2 + (l.tx - bcx) * k;
      l.ty = Z / 2 + (l.ty - bcy) * k;
      l.tw *= k;
      l.x = l.tx;
      l.y = l.ty;
    });

    this.P = { letters: L, S: S * k, T: pr.T, preset: pr.id };
    this.pt0 = performance.now();
  }

  posterFly(B, tt, P, C) {
    const ps = this.perch.slice().sort((a, b) => a.x - b.x);
    if (!ps.length) return;
    const p1 = ps[Math.floor(ps.length * 0.25)], p2 = ps[Math.min(ps.length - 1, Math.floor(ps.length * 0.75))];
    const A = [-80, 300], s1 = [p1.x, p1.y - p1.R * 0.55], s2 = [p2.x, p2.y - p2.R * 0.55], E = [1160, 260];
    const sz = Math.max(12, P.S * 0.09), t = tt / 1000, eo = v => this.eo(Math.max(0, Math.min(1, v)));
    const leg = (a, b, u, lift) => {
      const e = eo(u);
      return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e - Math.sin(e * Math.PI) * lift];
    };
    let p, flying = true, vx = 0;
    if (t < 1.8) { p = leg(A, s1, t / 1.8, 160); vx = 1; }
    else if (t < 3.4) { p = s1; flying = false; }
    else if (t < 4.6) { p = leg(s1, s2, (t - 3.4) / 1.2, 140); vx = s2[0] > s1[0] ? 1 : -1; }
    else if (t < 5.8) { p = s2; flying = false; }
    else { p = leg(s2, E, (t - 5.8) / 1.2, 60); vx = 1; }

    let o, ang;
    if (flying) {
      o = Math.abs(Math.cos(t * 17));
      p = [p[0] + Math.sin(t * 7) * 6, p[1] + Math.sin(t * 13) * 4];
      ang = vx * 0.3;
    } else {
      const burst = (t > 2.4 && t < 2.8) || (t > 5 && t < 5.3);
      o = burst ? 0.2 + 0.8 * Math.abs(Math.cos(t * 9)) : 0.3 + 0.1 * Math.sin(t * 3);
      ang = 0;
    }
    this.drawCreature(B, p[0], p[1], sz, ang, o, C);
  }

  bars(B, P, st, spread, hf) {
    const S = P.S, byLine = {};
    for (const l of P.letters) {
      if (l.ch === ' ') continue;
      const b = byLine[l.line] || (byLine[l.line] = { a: 1e9, z: -1e9, y: l.ty });
      b.a = Math.min(b.a, l.tx - l.tw / 2);
      b.z = Math.max(b.z, l.tx + l.tw / 2);
    }
    const w = Math.max(2, S * 0.035), h = 1.0 * S * hf;
    for (const k in byLine) {
      const b = byLine[k], cx = (b.a + b.z) / 2, half = (b.z - b.a) / 2 + 0.14 * S, cy = b.y - 0.33 * S;
      B.rect(cx - half * spread - w / 2, cy - h / 2, w, h, st.C.text);
      B.rect(cx + half * spread - w / 2, cy - h / 2, w, h, st.C.text);
    }
  }

  posterDraw(g, t) {

    if (!P) return;
    const Z = 1080, pc = this.pal();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = pc.bg;
    g.fillRect(0, 0, Z, Z);

    const tt = ((t % P.T) + P.T) % P.T, L = P.letters, B = this.backend(g);
    const st = {
      letters: L,
      S: P.S,
      C: pc.C,
      boil: this.props.boil ?? true,
      recoil: this.props.recoil ?? 20,
      speed: 1,
      wither: 600,
      textAll: true
    };
    L.forEach(l => { l.x = l.tx; l.y = l.ty; l.dead = null; });
    const set = base => L.forEach(l => {
      l.birth = base + l.b;
      l.tb = l.birth;
      l.cut = l.cutRel != null ? l.birth + l.cutRel : null;
    });

    let bars = null;
    if (P.preset === 'reference') {
      if (tt < 1950) { set(-1e5); bars = 1; }
      else if (tt < 2050) return;
      else if (tt < 2600) { this.bars(B, P, st, 0, this.eo((tt - 2050) / 550)); return; }
      else {
        const e = this.eo((tt - 2600) / 400);
        const lc = {};
        L.forEach(l => {
          if (l.ch === ' ') return;
          const b = lc[l.line] || (lc[l.line] = [1e9, -1e9]);
          b[0] = Math.min(b[0], l.tx - l.tw / 2);
          b[1] = Math.max(b[1], l.tx + l.tw / 2);
        });
        L.forEach(l => {
          const b = lc[l.line], c = b ? (b[0] + b[1]) / 2 : 540;
          l.x = c + (l.tx - c) * e;
        });
        set(3000);
        st.speed = 2.2;
        bars = e;
      }
    } else if (P.preset === 'breathe') {
      set(-1e5);
      const ph = tt / P.T * Math.PI * 2, S = P.S;
      st.warp = (x, y, l) => {
        const h = Math.max(0, (l.y - y) / S);
        return [
          x + Math.sin(ph + l.x * 0.004 + h * 1.1) * S * 0.03 * h,
          y + Math.cos(ph + x * 0.003) * S * 0.008 * h

      };
      st.rotw = e => Math.sin(ph + e.id * 0.7) * 0.12;
    } else if (P.preset === 'grow' || P.preset === 'scatter') {
      set(0);
      L.forEach(l => { if (tt >= l.d) l.dead = l.d; });
    } else if (P.preset === 'wind') {
      set(-1e5);
      const S = P.S, u = tt / P.T, front = -0.35 + u * 1.9;
      st.warp = (x, y, l) => {
        const hh = Math.max(0, (l.y - y) / S), d = l.x / 1080 - front;
        const g = d < 0 ? Math.exp(d * 2.2) * Math.cos(-d * 9) : Math.exp(-d * d * 30);
        const idle = Math.sin(tt / 1000 * 1.6 + l.x * 0.01) * 0.012;
        return [
          x + (g * 0.13 + idle) * S * hh * hh * 0.6 + (g * 0.13 + idle) * S * hh * 0.4,
          y + Math.abs(g) * 0.02 * S * hh
        ];
      };
      st.rotw = e => {
        const d = e.x / 1080 - front;
        return (d < 0 ? Math.exp(d * 2.2) * Math.cos(-d * 9) : Math.exp(-d * d * 30)) * 0.35;
      };
    } else if (P.preset === 'reach') {
      set(-1e5);
      const S = P.S, ph = tt / P.T * Math.PI * 2;
      const lx = 540 + Math.sin(ph) * 430, ly = 540 + Math.sin(ph * 2) * 260;
      this._light = [lx, ly];
      st.warp = (x, y, l) => {
        const dx = lx - l.x, dy = ly - (l.y - S * 0.6);
        const d = Math.hypot(dx, dy) || 1, w = Math.max(0, 1 - d / 560), s = w * w * (3 - 2 * w);
        const hh = Math.min(2.5, Math.max(0, (l.y - y) / S)), f = hh * hh * 0.5 + hh * 0.5;
        return [x + dx / d * s * S * 0.12 * f, y + dy / d * s * S * 0.06 * f];
      };

        const a = Math.atan2(ly - e.y, lx - e.x);

      };
    } else if (P.preset === 'visit') {
      set(-1e5);
      st.perchOn = true;
      this.perch = [];
      const ph = tt / P.T * Math.PI * 2;
      st.warp = (x, y, l) => {
        const hh = Math.max(0, (l.y - y) / P.S);
        return [x + Math.sin(ph + l.x * 0.004 + hh) * P.S * 0.015 * hh, y];
      };
    } else {
      if (tt >= 4400) return;
      set(0);
      st.letters = L.filter(l => tt >= l.birth);
      st.textAll = false;
    }

    this.render(B, tt, st);
    if (bars != null) this.bars(B, P, st, bars, 1);
    if (P.preset === 'reach') {
      const [lx, ly] = this._light, r = P.S * 0.09, pts = [];
      for (let k = 0; k < 20; k++) {
        const a = k / 20 * Math.PI * 2;
        pts.push([lx + Math.cos(a) * r, ly + Math.sin(a) * r]);
      }
      B.fill(pts, st.C.line);
    }
    if (P.preset === 'visit') this.posterFly(B, tt, P, st.C);
    if (P.preset === 'typed') {
      const born = st.letters, last = born[born.length - 1], S = P.S;
      if (Math.floor(tt / 400) % 2 === 0 || (last && tt - last.birth < 300)) {
        const x = last ? last.tx + last.tw / 2 + 0.07 * S : 540;
        const y = last ? last.ty - 0.33 * S : 540;
        const w = Math.max(2, S * 0.03), h = 0.8 * S;

      }
    }
  }

  // ---------- file export helpers ----------
  dl(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  savePNG() {
    this.paint(performance.now(), false);
    this.cv.toBlob(b => b && this.dl(b, `${this.state.theme}-garden.png`));
  }
  saveSVG() {
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const parts = [], n = v => Math.round(v * 100) / 100;
    const pb = () => ({
      d: '',
      moveTo(x, y) { this.d += `M${n(x)} ${n(y)}`; },
      lineTo(x, y) { this.d += `L${n(x)} ${n(y)}`; },
      quadraticCurveTo(a, b, x, y) { this.d += `Q${n(a)} ${n(b)} ${n(x)} ${n(y)}`; },
      closePath() { this.d += 'Z'; }
    });
    const B = {
      fill: (p, col) => {
        const b = pb();
        this.path(b, p, true);
        parts.push(`<path d="${b.d}" fill="${col}"/>`);
      },
      stroke: (p, col, w) => {
        const b = pb();
        this.path(b, p, false);
        parts.push(`<path d="${b.d}" fill="none" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`);
      },
      rect: () => {},
      text: (ch, x, y, S, col) => {
        parts.push(`<text x="${n(x)}" y="${n(y)}" text-anchor="middle" font-family="${this.F}" font-weight="700" font-size="${n(S)}" fill="${col}">${esc(ch)}</text>`);
      }
    };
    this.render(B, performance.now(), this.mainState());
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${n(this.W)}" height="${n(this.H)}" viewBox="0 0 ${n(this.W)} ${n(this.H)}"><rect width="100%" height="100%" fill="${this.pal().bg}"/>${parts.join('')}</svg>`;
    this.dl(new Blob([svg], { type: 'image/svg+xml' }), `${this.state.theme}-garden.svg`);
  }

  fname() {
    return `${this.state.theme}-` + (this.state.text || 'loop').trim().replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 24) + '-' + this.state.preset;
  }
  async exportVideo() {
    if (!this.vmime || this.state.busy) {
      this.posterStatusLabel.textContent = 'Video export isn’t supported in this browser — use PNG frames.';
      return;
    }
    const P = this.P, c = document.createElement('canvas');
    c.width = c.height = 1080;
    const g = c.getContext('2d'), stream = c.captureStream(0), track = stream.getVideoTracks()[0];
    const rec = new MediaRecorder(stream, { mimeType: this.vmime, videoBitsPerSecond: 14e6 }), chunks = [];
    rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
    const done = new Promise(r => { rec.onstop = r; });

    this.state.busy = true;
    this.exportVideoBtn.disabled = true;
    this.exportFramesBtn.disabled = true;
    this.posterStatusLabel.textContent = 'Recording…';

    this.posterDraw(g, 0);
    rec.start();
    const N = Math.round(P.T / 1000 * 30), wait = ms => new Promise(r => setTimeout(r, ms));
    const t0 = performance.now();
    for (let i = 0; i < N; i++) {
      this.posterDraw(g, i * 1000 / 30);
      if (track.requestFrame) track.requestFrame();
      if (i % 15 === 0) this.posterStatusLabel.textContent = `Recording ${Math.round(i / N * 100)}%`;
      const target = t0 + (i + 1) * 1000 / 30;
      await wait(Math.max(0, target - performance.now()));
    }
    rec.stop();
    await done;
    const ext = this.vmime.includes('mp4') ? 'mp4' : 'webm';
    this.dl(new Blob(chunks, { type: this.vmime.split(';')[0] }), `${this.fname()}.${ext}`);

    this.state.busy = false;
    this.exportVideoBtn.disabled = false;
    this.exportFramesBtn.disabled = false;
    this.posterStatusLabel.textContent = `Saved ${ext.toUpperCase()} · ${N} frames`;
  }

  async exportFrames() {
    if (this.state.busy) return;
    const P = this.P, c = document.createElement('canvas');
    c.width = c.height = 1080;
    const g = c.getContext('2d'), N = Math.round(P.T / 1000 * 30), files = [];

    this.state.busy = true;
    this.exportVideoBtn.disabled = true;
    this.exportFramesBtn.disabled = true;
    this.posterStatusLabel.textContent = 'Rendering frames…';

    for (let i = 0; i < N; i++) {
      this.posterDraw(g, i * 1000 / 30);
      const b = await new Promise(r => c.toBlob(r, 'image/png'));
      files.push({ name: `frame_${String(i + 1).padStart(4, '0')}.png`, data: new Uint8Array(await b.arrayBuffer()) });
      if (i % 10 === 0) this.posterStatusLabel.textContent = `Rendering ${Math.round(i / N * 100)}%`;
    }
    this.dl(this.zip(files), `${this.fname()}-frames.zip`);

    this.state.busy = false;
    this.exportVideoBtn.disabled = false;
    this.exportFramesBtn.disabled = false;
    this.posterStatusLabel.textContent = `Saved ${N} PNG frames · 30 fps`;
  }

  zip(files) {
    const crcT = this._crcT || (this._crcT = (() => {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {

      let c = 0xFFFFFFFF;
      for (let i = 0; i < d.length; i++) c = crcT[(c ^ d[i]) & 255] ^ (c >>> 8);

    const enc = new TextEncoder(), parts = [], cen = [];
    let off = 0;
    for (const f of files) {
      const nm = enc.encode(f.name), cr = crc(f.data), sz = f.data.length;
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true);
      h.setUint16(4, 20, true);
      h.setUint16(8, 0, true);
      h.setUint16(12, 33, true);
      h.setUint32(14, cr, true);
      h.setUint32(18, sz, true);
      h.setUint32(22, sz, true);
      h.setUint16(26, nm.length, true);
      parts.push(h.buffer, nm, f.data);

      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true);
      c.setUint16(4, 20, true);
      c.setUint16(6, 20, true);
      c.setUint16(14, 33, true);
      c.setUint32(16, cr, true);
      c.setUint32(20, sz, true);
      c.setUint32(24, sz, true);
      c.setUint16(28, nm.length, true);
      c.setUint32(42, off, true);
      cen.push(c.buffer, nm);
      off += 30 + nm.length + sz;
    }
    const cs = cen.reduce((s, b) => s + (b.byteLength || b.length), 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true);
    e.setUint16(8, files.length, true);
    e.setUint16(10, files.length, true);
    e.setUint32(12, cs, true);
    e.setUint32(16, off, true);
    return new Blob([...parts, ...cen, e.buffer], { type: 'application/zip' });
  }
}

window.addEventListener('DOMContentLoaded', () => {
  window.app = new TypeGardenApp();
});
</script>
